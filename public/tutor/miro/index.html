<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Klassio — урок-карта «Мир глазами астронома» (Miro-режим)</title>
<!-- Канвас Miro-режима. Источник: lesson-canvases/miro-astronom/entry.jsx
     (сборка esbuild → bundle.js, команда в шапке entry.jsx). Работает внутри
     iframe tutor-lesson[-ru].tsx через window.__klassioEngine. ?debug=1 —
     режиссёрская панель для ручного теста без голоса. -->
<link rel="stylesheet" href="./tldraw.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f7f2e8; }
  #app { position: fixed; inset: 0; }
  .tl-background { background-color: #f7f2e8 !important; }
  /* ЗАКОН, CSS-слой: pinch/двухпальцевые жесты не просачиваются мимо isLocked */
  .tl-container { touch-action: none !important; }
  @keyframes klassio-pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(232,131,58,.35); }
    50% { box-shadow: 0 0 0 12px rgba(232,131,58,0); }
  }
  @keyframes klassio-rise {
    from { transform: translateY(18px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  @keyframes klassio-shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-9px); } 40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); } 80% { transform: translateX(4px); }
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="./bundle.js"></script>
</body>
</html>
