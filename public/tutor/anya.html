        { height: 0, opacity: 0, marginTop: -8 },
        { height: full, opacity: 1, marginTop: 0, duration: .4, ease: 'power2.out', onComplete: setOpen });
      setTimeout(setOpen, 480);
      hintsShown++;
      if (hintsShown >= task.hints.length) hintBtn.style.display = 'none';
    }
    function finish() {
      hintBtn.style.display = 'none';
      feedback.innerHTML = '<span class="ok-badge"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>Верно! Молодец</span>';
      feedback.className = 'feedback ok';
      gsap.fromTo(feedback, { opacity: 0 }, { opacity: 1, duration: .4, ease: 'power1.out' });
      celebrate(wrap);
      if (opts.onSolved) opts.onSolved();
    }
    function celebrate(host) {
      const badge = host.querySelector('.ok-badge');
      if (badge) {
        const ring = document.createElement('span'); ring.className = 'ok-ring'; badge.appendChild(ring);
        gsap.fromTo(badge, { scale: 0, rotate: -18 }, { scale: 1, rotate: 0, duration: .6, ease: 'back.out(2.2)' });
        const path = badge.querySelector('path');
        if (path) { const L = path.getTotalLength ? path.getTotalLength() : 30; gsap.fromTo(path, { strokeDasharray: L, strokeDashoffset: L }, { strokeDashoffset: 0, duration: .45, delay: .12, ease: 'power2.out' }); }
        gsap.fromTo(ring, { scale: .4, opacity: .7 }, { scale: 1.8, opacity: 0, duration: .7, delay: .1, ease: 'power2.out' });
        // несколько сдержанных частиц
        const colors = ['var(--accent)', 'var(--accent-soft)', 'var(--av-3)'];
        for (let i = 0; i < 7; i++) {
          const p = document.createElement('span'); p.className = 'ok-dot';
          p.style.background = colors[i % 3]; badge.appendChild(p);
          const ang = (-90 + (i - 3) * 26) * Math.PI / 180, dist = 26 + Math.random() * 14;
          gsap.fromTo(p, { x: 0, y: 0, opacity: 1, scale: 1 },
            { x: Math.cos(ang) * dist, y: Math.sin(ang) * dist - 6, opacity: 0, scale: .4, duration: .7, delay: .12, ease: 'power2.out', onComplete: () => p.remove() });
        }
      }
    }
    function showWrong() {
      feedback.innerHTML = '<span class="fx">✕</span><span>Не угадал — посмотри подсказку и попробуй ещё</span>';
      feedback.className = 'feedback no';
      gsap.fromTo(feedback, { opacity: 0 }, { opacity: 1, duration: .35, ease: 'power1.out' });
      setTimeout(() => gsap.set(feedback, { opacity: 1 }), 420);
    }
    return wrap;
  }

  // ---------- Глоссарий ----------
  function buildGlossaryList(container, unlocked) {
    container.innerHTML = '';
    window.GLOSSARY.forEach((g) => {
      const open = unlocked.has(g.term);
      const item = el('div', 'gl-item' + (open ? '' : ' locked'));
      const t = el('div', 'gl-term');
      t.appendChild(el('span', null, open ? g.term : '• • •'));
      item.appendChild(t);
      if (open) item.appendChild(el('div', 'gl-def', g.def));
      container.appendChild(item);
    });
  }

  // ---------- Диспетчер доски ----------
  function buildBoard(variant) {
    switch (variant) {
      case 'cover': return buildCover();
      case 'etymology': return buildEtymology();
      case 'bodies': return buildBodies();
      case 'solar': return buildSolar();
      case 'sunEarth': return buildBoardSunEarth();
      case 'facts': return buildFacts();
      case 'reward': return buildReward();
      case 'notice': return buildNotice();
      default: return null;
    }
  }

  window.Tools = {
    buildBoard, animateBoard, buildTrainer, buildReward, animateReward,
    buildNotice, buildGlossaryList, preloadImages,
  };
})();
</script>
<script>// ============ ButtonFX — стили и hi-end GSAP-анимации кнопок ============
// 4 визуальных стиля (body.bstyle-1..4) + 4 анимации (body.banim-1..4).
// Анимации: 1 Подъём · 2 Магнит · 3 Свечение · 4 Пружина.
(function () {
  const SEL = '.opt, .submit-btn, .btile, .d3-btn';
  const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let anim = 1;
  const tracked = new WeakSet();

  function disabled(b) { return b.disabled || b.classList.contains('correct') || b.getAttribute('aria-disabled') === 'true'; }

  function attach(btn) {
    if (tracked.has(btn) || !window.gsap) return;
    tracked.add(btn);
    btn.classList.add('fxbtn');
    const xTo = gsap.quickTo(btn, 'x', { duration: .55, ease: 'power3' });
    const yTo = gsap.quickTo(btn, 'y', { duration: .55, ease: 'power3' });
    const sTo = gsap.quickTo(btn, 'scale', { duration: .4, ease: 'power3' });
    const reset = () => { xTo(0); yTo(0); sTo(1); btn.classList.remove('fx-glow'); };

    btn.addEventListener('pointerenter', () => {
      if (RM || disabled(btn)) return;
      if (anim === 1) { gsap.to(btn, { y: -2.5, scale: 1.008, duration: .12, ease: 'power3.out', overwrite: true }); }
      else if (anim === 2) { sTo(1.03); }
      else if (anim === 3) { sTo(1.035); btn.classList.add('fx-glow'); }
      else if (anim === 4) { sTo(1.045); }
    });
    btn.addEventListener('pointermove', (e) => {
      if (RM || anim !== 2 || disabled(btn)) return;
      const r = btn.getBoundingClientRect();
      const mx = e.clientX - (r.left + r.width / 2);
      const my = e.clientY - (r.top + r.height / 2);
      xTo(mx * 0.28); yTo(my * 0.42);
    });
    btn.addEventListener('pointerleave', () => {
      if (RM) return;
      btn.classList.remove('fx-glow');
      if (anim === 1) { gsap.to(btn, { y: 0, scale: 1, duration: .12, ease: 'power3.out', overwrite: true }); }
      else { xTo(0); yTo(0); sTo(1); }
    });
    btn.addEventListener('pointerdown', () => {
      if (RM || disabled(btn)) return;
      gsap.to(btn, { scale: anim === 4 ? 0.9 : 0.96, duration: .12, ease: 'power2.out' });
    });
    const up = () => {
      if (RM || disabled(btn)) return;
      if (anim === 4) gsap.to(btn, { scale: 1.045, duration: .7, ease: 'elastic.out(1,0.38)' });
      else gsap.to(btn, { scale: anim === 1 ? 1.012 : 1.0, duration: .3, ease: 'power2.out' });
    };
    btn.addEventListener('pointerup', up);
  }

  function scan(root) { (root || document).querySelectorAll(SEL).forEach(attach); }

  const mo = new MutationObserver((muts) => {
    for (const m of muts) {
      m.addedNodes && m.addedNodes.forEach((n) => {
        if (n.nodeType !== 1) return;
        if (n.matches && n.matches(SEL)) attach(n);
        if (n.querySelectorAll) scan(n);
      });
    }
  });

  function setStyle(n) {
    document.body.classList.remove('bstyle-1', 'bstyle-2', 'bstyle-3', 'bstyle-4');
    document.body.classList.add('bstyle-' + n);
  }
  function setAnim(n) {
    anim = n;
    document.body.classList.remove('banim-1', 'banim-2', 'banim-3', 'banim-4');
    document.body.classList.add('banim-' + n);
  }
  function init(style, an) {
    setStyle(style || 4); setAnim(an || 1);
    scan(document);
    mo.observe(document.body, { childList: true, subtree: true });
  }

  window.ButtonFX = { init, scan, setStyle, setAnim };
})();
</script>
<script>/*KLASSIO-LIVE*/window.__KLASSIO_REAL_LESSON=window.LESSON;window.LESSON=[{type:'say',section:'',board:null,status:'listening',lines:[]}];window.__KLASSIO_LIVE=true;window.__klassioChildName='Ты';</script>
<script>// ============ Движок урока: шаги, ключевой жест, печать, глоссарий, навигация ============
(function () {
  const RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s) => document.querySelector(s);

  let stage, chatZone, chat, toolZone, micCap, avMini, micHalo, avRing, micBtn;
  let mode = 'lesson', idx = 0, lessonIdx = 0;
  let chatAside = false, lineTL = null, currentTool = null, curBoard = null, curVariant = null;
  let statusTweens = {}, muted = false, curStatus = 'listening', curSection = '';
  const unlocked = new Set();

  function list() { return mode === 'mod' ? window.MODERATION : window.LESSON; }
  function cur() { return list()[idx]; }

  // ---------- Статус ----------
  function setStatus(s) {
    curStatus = s;
    avMini.className = 'av-mini is-' + s;
    if (!muted) micCap.textContent = window.MIC_CAP[s];
    const stt = avMini.querySelector('.stt');
    if (stt) stt.textContent = { listening: 'слушает', speaking: 'говорит', thinking: 'думает' }[s];
    if (RM) return;
    if (statusTweens.ring) statusTweens.ring.kill();
    if (s === 'speaking') {
      gsap.set(avRing, { opacity: .5, scale: 1 });
      statusTweens.ring = gsap.to(avRing, { opacity: 0, scale: 1.5, duration: 1.7, repeat: -1, ease: 'sine.out' });
    } else gsap.to(avRing, { opacity: 0, duration: .4 });
    if (statusTweens.halo) statusTweens.halo.kill();
    if (muted) { gsap.set(micHalo, { opacity: 0 }); return; }
    const strong = s === 'listening';
    gsap.set(micHalo, { opacity: strong ? .55 : .28, scale: 1 });
    statusTweens.halo = gsap.to(micHalo, { opacity: 0, scale: strong ? 1.9 : 1.5, duration: strong ? 1.8 : 2.6, repeat: -1, ease: 'sine.out' });
  }
  function setMuted(m) {
    muted = m;
    micBtn.classList.toggle('muted', m);
    if (m) { micCap.textContent = 'Микрофон выключен'; if (statusTweens.halo) statusTweens.halo.kill(); gsap.to(micHalo, { opacity: 0, duration: .3 }); }
    else setStatus(curStatus);
  }

  // ---------- Ключевой жест ----------
  const RAIL_SCALE = 0.78;
  function margin() { return Math.max(28, stage.clientWidth * 0.03); }
  function placeChat(animate) {
    const w = stage.clientWidth, d = animate && !RM ? 1.15 : 0;
    const W = chatZone.offsetWidth || 480;
    let to;
    if (chatAside) {
      chatZone.classList.add('rail');
      const center = margin() + (W * RAIL_SCALE) / 2;   // левый край с отступом
      to = { x: center - w / 2, scale: RAIL_SCALE };
    } else {
      chatZone.classList.remove('rail');
      to = { x: 0, scale: 1 };
    }
    if (d) { gsap.to(chatZone, { ...to, duration: d, ease: 'power2.inOut' }); clearTimeout(chatZone._ft); chatZone._ft = setTimeout(() => gsap.set(chatZone, to), d * 1000 + 200); }
    else gsap.set(chatZone, to);
  }
  function placeTool(animate) {
    if (!currentTool) return;
    const w = stage.clientWidth, d = animate && !RM ? 1.15 : 0;
    const railW = chatAside ? (chatZone.offsetWidth || 480) * RAIL_SCALE : 0;
    const railRight = margin() + railW;
    const tw = currentTool.offsetWidth;
    let center = Math.max(w / 2, railRight + tw / 2 + 20);   // по центру, сдвиг вправо только если упирается в рельс
    center = Math.min(center, w - tw / 2 - margin());
    const to = { x: center - w / 2 };
    if (d) { gsap.to(toolZone, { ...to, duration: d, ease: 'power2.inOut' }); clearTimeout(toolZone._ft); toolZone._ft = setTimeout(() => gsap.set(toolZone, to), d * 1000 + 200); }
    else gsap.set(toolZone, to);
  }
  function slideAside(a) { chatAside = true; placeChat(a); }
  function slideCenter(a) { chatAside = false; placeChat(a); }

  // ---------- Инструмент в центре ----------
  function hideTool(animate) {
    if (!currentTool) return;
    gsap.killTweensOf(toolZone);
    const old = currentTool; currentTool = null; curBoard = null; curVariant = null;
    const done = () => { old.remove(); gsap.set(toolZone, { x: 0 }); };
    if (animate && !RM) gsap.to(toolZone, { opacity: 0, scale: .965, duration: .85, ease: 'power1.inOut', onComplete: done });
    else { gsap.set(toolZone, { opacity: 0, scale: .9 }); done(); }
    toolZone.classList.remove('on');
  }
  function showTool(step, animate) {
    const variant = step.type === 'task' ? 'trainer' : step.board;
    if (!variant) { hideTool(animate); return; }
    let node;
    if (variant === 'trainer') node = window.Tools.buildTrainer(step, { onSolved: () => onTaskSolved(step) });
    else node = window.Tools.buildBoard(variant);
    if (!node) { hideTool(animate); return; }

    gsap.killTweensOf(toolZone);
    if (curBoard) { window.Tools.animateBoard(curBoard, false); curBoard = null; }
    toolZone.innerHTML = '';
    toolZone.appendChild(node);
    toolZone.classList.add('on');
    currentTool = node; curVariant = variant;
    placeTool(false);
    const reveal = () => {
      if (variant === 'solar') { curBoard = node; window.Tools.animateBoard(node, true); }
      if (variant === 'reward') window.Tools.animateReward(node);
    };
    if (animate && !RM) {
      gsap.set(toolZone, { opacity: 0, scale: .965 });
      gsap.to(toolZone, { opacity: 1, scale: 1, duration: .95, delay: .42, ease: 'power2.out', onStart: reveal });
      clearTimeout(toolZone._fr);
      toolZone._fr = setTimeout(() => { if (currentTool === node) gsap.set(toolZone, { opacity: 1, scale: 1 }); }, 1600);
    } else { gsap.set(toolZone, { opacity: 1, scale: 1 }); reveal(); }
  }

  // ---------- Чат (постоянная лента) ----------
  const solvedTasks = new Set();
  function makeBubble(line) {
    const b = document.createElement('div');
    b.className = 'bubble ' + line.w;
    const who = document.createElement('span'); who.className = 'who';
    who.textContent = line.w === 'tutor' ? 'Аня' : 'Макс';
    const body = document.createElement('span'); body.className = 'body';
    line.t.split(' ').forEach((word, i) => {
      const s = document.createElement('span'); s.className = 'w';
      s.textContent = (i ? ' ' : '') + word; body.appendChild(s);
    });
    b.appendChild(who); b.appendChild(body);
    return b;
  }
  function revealWords(b) {
    b.style.opacity = 1;
    b.querySelectorAll('.w').forEach((w) => { w.style.opacity = 1; w.style.filter = 'none'; w.style.transform = 'none'; });
  }
  function toBottom() { chat.scrollTop = chat.scrollHeight; if (typeof updateChatFade === 'function') updateChatFade(); }

  // собрать все реплики от шага 0 до текущего (постоянный транскрипт)
  function buildMessages() {
    const L = list(); const msgs = [];
    for (let i = 0; i <= idx; i++) {
      const st = L[i];
      if (st.type === 'task') {
        msgs.push({ line: st.intro || { w: 'tutor', t: st.q }, step: i });
        if (i < idx || solvedTasks.has(st.id)) msgs.push({ line: { w: 'tutor', t: st.explain }, step: i });
      } else (st.lines || []).forEach((ln) => msgs.push({ line: ln, step: i }));
    }
    return msgs;
  }
  function lastW(msgs) { return msgs.length ? msgs[msgs.length - 1].line.w : 'tutor'; }

  // перерисовать ленту: старые реплики мгновенно, реплики текущего шага — печатаются
  function renderTranscript(animateCurrent) {
    if (lineTL) { lineTL.kill(); lineTL = null; }
    clearTimeout(chat._ft);
    chat.innerHTML = '';
    const msgs = buildMessages();
    const cur = [];
    msgs.forEach((m) => {
      const b = makeBubble(m.line); chat.appendChild(b);
      if (m.step === idx && animateCurrent && !RM) { gsap.set(b, { opacity: 0 }); cur.push({ b, words: b.querySelectorAll('.w'), line: m.line }); }
      else revealWords(b);
    });
    toBottom();
    if (!cur.length || RM) { setStatus(lastW(msgs) === 'tutor' ? 'speaking' : 'listening'); return; }
    lineTL = gsap.timeline();
    let total = 0;
    cur.forEach(({ b, words, line }) => {
      const stg = line.w === 'tutor' ? 0.09 : 0.04;
      lineTL.call(() => { setStatus(line.w === 'tutor' ? 'speaking' : 'listening'); toBottom(); });
      lineTL.fromTo(b, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .35, ease: 'power3.out' });
      lineTL.fromTo(words, { opacity: 0, y: 8, filter: 'blur(5px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: .5, stagger: stg, ease: 'power3.out', onUpdate: toBottom }, '<0.05');
      lineTL.to({}, { duration: 0.3 });
      total += 0.35 + words.length * stg + 0.5 + 0.3;
    });
    clearTimeout(chat._ft);
    chat._ft = setTimeout(() => { cur.forEach(({ b }) => revealWords(b)); toBottom(); setStatus(lastW(msgs) === 'tutor' ? 'speaking' : 'listening'); }, total * 1000 + 400);
  }

  // объяснение после решённой задачи — дописываем в ленту
  function onTaskSolved(step) {
    if (window.__KLASSIO_LIVE) { if (!solvedTasks.has(step.id)) { solvedTasks.add(step.id); if (window.__klassioEngine && window.__klassioEngine.onSolve) { try { window.__klassioEngine.onSolve(step); } catch (e) {} } } return; }
    if (solvedTasks.has(step.id)) return; solvedTasks.add(step.id);
    const b = makeBubble({ w: 'tutor', t: step.explain }); chat.appendChild(b); toBottom();
    setStatus('speaking');
    const words = b.querySelectorAll('.w');
    if (RM) { revealWords(b); return; }
    gsap.fromTo(b, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .35, ease: 'power3.out' });
    gsap.fromTo(words, { opacity: 0, y: 8, filter: 'blur(5px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: .5, stagger: .07, ease: 'power3.out', onUpdate: toBottom });
    setTimeout(() => { revealWords(b); toBottom(); }, words.length * 90 + 900);
  }

  // ---------- Глоссарий ----------
  function recomputeGlossary() {
    unlocked.clear();
    const L = window.LESSON;
    for (let i = 0; i <= (mode === 'lesson' ? idx : L.length - 1); i++) {
      const st = mode === 'lesson' ? L[i] : null;
      if (st && st.unlock) st.unlock.forEach((t) => unlocked.add(t));
    }
    const n = unlocked.size;
    const badge = $('.gloss-count'); if (badge) badge.textContent = n + '/' + window.GLOSSARY.length;
    if ($('.gloss-panel').classList.contains('open')) window.Tools.buildGlossaryList($('.gloss-list'), unlocked);
  }

  // ---------- Рендер шага ----------
  function renderStep(step, animate) {
    if (step.section) curSection = step.section;
    $('.phase-name').textContent = curSection || step.section || '';
    const hasTool = step.type === 'task' || !!step.board;
    if (hasTool) { if (!chatAside) slideAside(animate); showTool(step, animate); }
    else { if (chatAside) slideCenter(animate); hideTool(animate); }
    // чат — постоянная лента; печатается только текущий шаг
    renderTranscript(true);
    recomputeGlossary();
  }

  // ---------- Навигация ----------
  function go(dir) { goTo(idx + dir, true); }
  function goTo(i, animate) {
    const L = list();
    idx = Math.max(0, Math.min(i, L.length - 1));
    if (mode === 'lesson') lessonIdx = idx;
    renderStep(cur(), animate);
    updateProgress();
  }
  function updateProgress() {
    const L = list(), n = L.length;
    $('.pg-fill').style.width = ((idx + 1) / n * 100) + '%';
    $('.pg-num').textContent = (idx + 1) + ' / ' + n;
  }
  function setMode(m) {
    mode = m;
    $('.scenario-btn').classList.toggle('on', m === 'mod');
    $('.scenario-btn').textContent = m === 'mod' ? '← К уроку' : 'Сценарий: грубость';
    document.body.classList.toggle('mod-on', m === 'mod');
    goTo(m === 'mod' ? 0 : lessonIdx, true);
    recomputeGlossary();
  }

  // ---------- Init ----------
  function init() {
    stage = $('.stage'); chatZone = $('.chat-zone'); chat = $('#chat');
    toolZone = $('#toolZone'); micCap = $('.mic-cap'); avMini = $('.av-mini');
    micHalo = $('.mic-halo'); avRing = $('.av-mini .ring'); micBtn = $('.mic');

    gsap.set([chatZone, toolZone], { xPercent: -50, yPercent: -50, x: 0, y: 0 });
    gsap.set(toolZone, { opacity: 0, scale: .9 });

    $('.nav-prev').onclick = () => go(-1);
    $('.nav-next').onclick = () => go(1);
    $('.scenario-btn').onclick = () => setMode(mode === 'mod' ? 'lesson' : 'mod');
    micBtn.onclick = () => setMuted(!muted);

    // прогресс-бар: клик = переход
    $('.pg-track').addEventListener('click', (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      const p = (e.clientX - r.left) / r.width;
      goTo(Math.round(p * (list().length - 1)), true);
    });

    // глоссарий
    $('.gloss-btn').onclick = () => {
      const panel = $('.gloss-panel');
      const open = panel.classList.toggle('open');
      if (open) window.Tools.buildGlossaryList($('.gloss-list'), unlocked);
    };
    $('.gloss-close').onclick = () => $('.gloss-panel').classList.remove('open');

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.key === 'ArrowRight') go(1);
      if (e.key === 'ArrowLeft') go(-1);
    });
    window.addEventListener('resize', () => { placeChat(false); placeTool(false); });

    // фейд снизу убираем, когда долистали до последней реплики
    chat.addEventListener('scroll', updateChatFade);

    // конец чата: палочка + резиновое «натяжение» вниз с пружиной обратно
    let pull = 0, pullT = null;
    chat.addEventListener('wheel', (e) => {
      const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 2;
      if (e.deltaY > 0 && atBottom) {
        chatZone.classList.add('show-end');
        if (!RM) {
          pull = Math.min(34, pull + e.deltaY * 0.12);
          gsap.to(chat, { y: pull, duration: .22, ease: 'power3.out', overwrite: true });
        }
        clearTimeout(chatZone._et);
        chatZone._et = setTimeout(() => chatZone.classList.remove('show-end'), 480);
        clearTimeout(pullT);
        pullT = setTimeout(() => {
          pull = 0;
          if (!RM) gsap.to(chat, { y: 0, duration: 1.1, ease: 'elastic.out(0.78,0.62)', overwrite: true });
        }, 120);
      }
    }, { passive: true });

    // переключатель фона (1 чистый · 2 зерно · 3 сетка · 4 точки)
    let bgMode = 4;
    document.body.classList.add('bg-4');
    $('.bg-num').textContent = bgMode;
    $('.bg-btn').onclick = () => {
      document.body.classList.remove('bg-' + bgMode);
      bgMode = bgMode % 4 + 1;
      document.body.classList.add('bg-' + bgMode);
      $('.bg-num').textContent = bgMode;
    };

    // KLASSIO-LIVE: таймер стартует при подключении учителя (engine.startTimer)

    // предзагрузка иллюстраций (без чёрной вспышки)
    if (window.Tools && window.Tools.preloadImages) window.Tools.preloadImages();

    // кнопки: стиль + анимация (tweak)
    if (window.ButtonFX) {
      const styleSel = $('.btn-style-sel'), animSel = $('.btn-anim-sel');
      const st = styleSel ? parseInt(styleSel.value, 10) : 4;
      const an = animSel ? parseInt(animSel.value, 10) : 1;
      window.ButtonFX.init(st, an);
      if (styleSel) styleSel.addEventListener('change', () => window.ButtonFX.setStyle(parseInt(styleSel.value, 10)));
      if (animSel) animSel.addEventListener('change', () => window.ButtonFX.setAnim(parseInt(animSel.value, 10)));
    }

    // ползунки «углы» — отдельно чат и отдельно поля/доски
    const rChat = $('.round-chat'), rUi = $('.round-ui');
    if (rChat) {
      const apply = () => {
        const v = parseInt(rChat.value, 10);
        document.documentElement.style.setProperty('--r-bub', v + 'px');
        $('.round-chat-v').textContent = v;
      };
      apply(); rChat.addEventListener('input', apply);
    }
    if (rUi) {
      const apply = () => {
        const v = parseInt(rUi.value, 10);
        document.documentElement.style.setProperty('--r-field', v + 'px');
        document.documentElement.style.setProperty('--r-card', (v + 14) + 'px');
        $('.round-ui-v').textContent = v;
      };
      apply(); rUi.addEventListener('input', apply);
    }

    goTo(0, false);
    /*KLASSIO-LIVE-API*/
    window.__klassioEngine = {
      setStatus: function (s) { try { setStatus(s); } catch (e) {} },
      setCaption: function (txt) { try { var c = document.querySelector('.mic-cap'); if (c) c.textContent = txt; } catch (e) {} },
      showBoard: function (variant, animate) {
        try { if (!chatAside) slideAside(animate !== false); showTool({ type: 'say', board: variant }, animate !== false); }
        catch (e) { console.error('[klassio] showBoard', e); }
      },
      showTask: function (step, animate) {
        try { if (!chatAside) slideAside(animate !== false); showTool(Object.assign({ type: 'task' }, step), animate !== false); }
        catch (e) { console.error('[klassio] showTask', e); }
      },
      hideTool: function (animate) { try { slideCenter(animate !== false); hideTool(animate !== false); } catch (e) {} },
      pushBubble: function (w, t) {
        try {
          var b = makeBubble({ w: w, t: t });
          // child label = the name the child told Аня (fallback «Ты»), not the
          // demo's hard-coded «Макс».
          if (w === 'child') { var who0 = b.querySelector('.who'); if (who0) who0.textContent = window.__klassioChildName || 'Ты'; }
          if (w === 'tutor') { var who1 = b.querySelector('.who'); if (who1) who1.textContent = window.__klassioTutorName || 'Аня'; }
          chat.appendChild(b); toBottom();
          setStatus(w === 'tutor' ? 'speaking' : 'listening');
          if (RM) { revealWords(b); return; }
          // Type-in: starts immediately (when she starts speaking) but the words
          // "run" gently so the chat reads at a calm pace alongside her voice.
          var words = b.querySelectorAll('.w'); var stg = 0.06;
          gsap.fromTo(b, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: .2, ease: 'power3.out' });
          gsap.fromTo(words, { opacity: 0, y: 6, filter: 'blur(4px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: .45, stagger: stg, ease: 'power3.out', onUpdate: toBottom });
          setTimeout(function () { revealWords(b); toBottom(); }, words.length * (stg * 1000) + 600);
        } catch (e) { console.error('[klassio] pushBubble', e); }
      },
      setChildName: function (name) {
        try {
          if (!name) return;
          window.__klassioChildName = String(name).trim();
          document.querySelectorAll('#chat .bubble.child .who').forEach(function (el) { el.textContent = window.__klassioChildName; });
        } catch (e) {}
      },
      // Set the TEACHER's display name everywhere: the avatar letter (CSS
      // ::before, overridden via an injected <style>) + every tutor bubble label.
      // Lets each voice be a distinct named teacher (Надя / Аня / Рина).
      setTeacherName: function (name) {
        try {
          if (!name) return;
          window.__klassioTutorName = String(name).trim();
          var L = window.__klassioTutorName.charAt(0).toUpperCase();
          document.querySelectorAll('#chat .bubble:not(.child) .who').forEach(function (el) { el.textContent = window.__klassioTutorName; });
          var st = document.getElementById('klassio-av-letter');
          if (!st) { st = document.createElement('style'); st.id = 'klassio-av-letter'; document.head.appendChild(st); }
          st.textContent = '.av-mini .disc::before{content:"' + L + '"!important}';
        } catch (e) {}
      },
      setMuted: function (m) { try { setMuted(!!m); } catch (e) {} },
      showStartButton: function () { var el = document.getElementById('klassio-start'); if (el) el.style.display = 'flex'; },
      hideStartButton: function () { var el = document.getElementById('klassio-start'); if (el) el.style.display = 'none'; },
      setStartButtonText: function (txt, disabled) { try { var w = document.getElementById('klassio-start'); if (!w) return; var b = w.querySelector('button'); if (!b) return; b.textContent = txt; b.disabled = !!disabled; b.style.opacity = disabled ? '0.65' : '1'; } catch (e) {} },
      startTimer: function () { try { if (window.__klassioTimerStarted) return; window.__klassioTimerStarted = true; startTimer(); } catch (e) {} },
      setVoiceMenu: function (voices, selectedKey) {
        try {
          var m = document.getElementById('klassio-voice-menu'); if (!m) return;
          m.innerHTML = '';
          (voices || []).forEach(function (v) {
            var b = document.createElement('button');
            b.textContent = v.label;
            b.style.cssText = 'border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;text-align:left;white-space:nowrap;background:' + (v.key === selectedKey ? 'var(--accent)' : 'transparent') + ';color:' + (v.key === selectedKey ? '#fff' : '#3a3a3a');
            b.onclick = function (e) { e.stopPropagation(); if (window.__klassioEngine && window.__klassioEngine.onVoiceSelect) window.__klassioEngine.onVoiceSelect(v.key); };
            m.appendChild(b);
          });
        } catch (e) {}
      },
      onStart: null,
      onWrong: null,
      onVoiceSelect: null,
      onPlanetClick: null,
      onMute: null,
      onSolve: null,
    };
    /* mic button = MUTE/UNMUTE only (never starts/ends the lesson). Toggles the
       design's own visual mute, then notifies React to mute the live SDK. */
    micBtn.onclick = function () { setMuted(!muted); if (window.__klassioEngine.onMute) window.__klassioEngine.onMute(muted); };
    /* in-design START button: a clone of the test buttons (class .submit-btn →
       inherits the design CSS + ButtonFX hover/press animation), coloured like
       the mic (var(--accent)). React registers __klassioEngine.onStart. */
    (function () {
      var wrap = document.createElement('div');
      wrap.id = 'klassio-start';
      // hidden until React has wired onStart (avoids a dead click during the
      // big iframe load), then shown by the React status effect.
      wrap.style.cssText = 'position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:60;pointer-events:none';
      var b = document.createElement('button');
      b.className = 'submit-btn';
      b.textContent = 'Начать урок';
      b.style.cssText = 'pointer-events:auto;background:var(--accent);color:#fff;font-size:23px;font-weight:800;padding:30px 62px;border:none;cursor:pointer;line-height:1.1';
      b.onclick = function () { if (window.__klassioEngine && window.__klassioEngine.onStart) window.__klassioEngine.onStart(); };
      wrap.appendChild(b); document.body.appendChild(wrap);
    })();
    /* wrong-answer signal: the design marks a wrong option .wrong/.bad but gives
       no callback — observe it and notify React so Аня can help (not stay silent). */
    (function () {
      var lastWrong = 0;
      var mo = new MutationObserver(function (muts) {
        for (var i = 0; i < muts.length; i++) {
          var t = muts[i].target;
          if (t && t.classList && (t.classList.contains('wrong') || t.classList.contains('bad'))) {
            var now = Date.now();
            if (now - lastWrong < 1500) return;
            lastWrong = now;
            if (window.__klassioEngine && window.__klassioEngine.onWrong) { try { window.__klassioEngine.onWrong(); } catch (e) {} }
            return;
          }
        }
      });
      mo.observe(toolZone, { subtree: true, attributes: true, attributeFilter: ['class'] });
    })();
    /* voice picker as a hover-dropdown on Аня's avatar (.av-mini) in the header. */
    (function () {
      var av = document.querySelector('.av-mini');
      if (!av) return;
      av.style.position = 'relative'; av.style.cursor = 'pointer';
      var menu = document.createElement('div');
      menu.id = 'klassio-voice-menu';
      menu.style.cssText = 'position:absolute;top:calc(100% + 10px);left:50%;transform:translate(-50%,-6px);background:#fff;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.18);padding:6px;display:flex;flex-direction:column;gap:3px;opacity:0;pointer-events:none;transition:opacity .22s ease, transform .22s ease;z-index:90';
      av.appendChild(menu);
      av.addEventListener('mouseenter', function () { menu.style.opacity = '1'; menu.style.transform = 'translate(-50%,0)'; menu.style.pointerEvents = 'auto'; });
      av.addEventListener('mouseleave', function () { menu.style.opacity = '0'; menu.style.transform = 'translate(-50%,-6px)'; menu.style.pointerEvents = 'none'; });
    })();
    /* wire the design's own «Выйти» button → leave to the cabinet (React cleanup
       ends the voice session). */
    (function () {
      var ex = document.querySelector('.exit');
      if (ex) ex.onclick = function () { try { window.top.location.href = '/cabinet/okr-mir-4'; } catch (e) { window.location.href = '/cabinet/okr-mir-4'; } };
    })();
    /* planet/sun clicks on the Solar-System board → tell Аня so she narrates
       (CAPTURE phase: the design calls stopPropagation() on the planet button). */
    (function () {
      var last = 0;
      document.addEventListener('click', function (e) {
        var t = e.target;
        while (t && t.nodeType === 1) {
          if (t.classList && t.classList.contains('p3')) {
            var lbl = t.querySelector('.p3-lbl');
            var name = ((lbl && lbl.textContent) ? lbl.textContent : (t.title || '')).trim();
            var now = Date.now();
            if (name && now - last > 800) {
              last = now;
              if (window.__klassioEngine && window.__klassioEngine.onPlanetClick) { try { window.__klassioEngine.onPlanetClick(name); } catch (e2) {} }
            }
            return;
          }
          t = t.parentNode;
        }
      }, true);
    })();
  }

  // ---------- Таймер урока ----------
  function startTimer() {
    const val = $('.timer-val');
    const t0 = Date.now();
    const tick = () => {
      const s = Math.floor((Date.now() - t0) / 1000);
      const mm = String(Math.floor(s / 60)).padStart(2, '0');
      const ss = String(s % 60).padStart(2, '0');
      if (val) val.textContent = mm + ':' + ss;
    };
    tick();
    setInterval(tick, 1000);
  }

  // ---------- Фейд чата (снизу гаснет, только если не у конца) ----------
  function updateChatFade() {
    const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 8;
    const atTop = chat.scrollTop < 8;
    chat.classList.toggle('at-bottom', atBottom);
    chat.classList.toggle('at-top', atTop);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
