<style>
/* ============================================================================
   Канвас урока «Твоя первая банковская карта» · v3 (демо ВТБ, стилизованно —
   на карте текст «ВТБ», логотип не используется). Контракт:
   window.__klassioEngine + window.__KLASSIO_REAL_LESSON.
   v3: карта переворачивается (оборот с магнитной полосой и CVV, свои выноски),
   кнопка «Подсказка» в тренажёре, все эмодзи заменены на line-иконки (SVG),
   листание стрелками ←/→ для ручного теста.
   ========================================================================== */
:root{
  --bg:#EDF3FB; --dot:#D3E0F1;
  --ink:#0E2247; --ink-soft:#5A6C8A; --ink-faint:#8FA2BE;
  --brand:#1B4BD2; --brand-deep:#0F3AB0; --accent:#2E5BFF; --accent-soft:#DCE7FF;
  --navy0:#0A2456; --navy1:#133B7A;
  --ok:#2BA05A; --ok-soft:#E2F5E9; --bad:#D64545; --bad-soft:#FBE7E7;
  --paper:#FFFFFF;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Onest',system-ui,-apple-system,sans-serif;color:var(--ink);overflow:hidden;
  background:var(--bg);
  background-image:radial-gradient(var(--dot) 1.15px, transparent 1.15px);
  background-size:26px 26px;
}
button{font-family:inherit;cursor:pointer}
a{color:var(--brand)} a:hover{color:var(--brand-deep)}
.isvg{flex:0 0 auto;vertical-align:-3px}

/* ─────────── топбар ─────────── */
#topbar{position:fixed;left:0;right:0;top:0;height:62px;z-index:40;display:flex;align-items:center;gap:14px;padding:0 22px}
.tb-card{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);
  border-radius:16px;padding:9px 16px;box-shadow:0 4px 18px rgba(14,34,71,.08),inset 0 0 0 1px rgba(27,75,210,.07)}
#logo{font-weight:900;font-size:17px;letter-spacing:.2px}
#logo .lg{display:inline-flex;width:24px;height:24px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#6C9BFF);
  margin-right:8px;vertical-align:-6px}
#lessonChip{font-weight:700;font-size:14.5px;color:var(--ink-soft)}
#lessonChip b{color:var(--ink)}
#avatarChip{position:relative;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
#avaOrb{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 32% 30%,#7FB2FF,var(--brand));color:#fff;font-weight:800;font-size:13px;
  box-shadow:0 0 0 3px rgba(46,91,255,.16)}
#avaOrb.talk{animation:orbTalk 1.5s ease-in-out infinite}
@keyframes orbTalk{50%{box-shadow:0 0 0 7px rgba(46,91,255,.22)}}
#statusDot{width:8px;height:8px;border-radius:50%;background:#93A3BE;transition:.2s}
#statusTxt{font-size:14px;font-weight:600;color:var(--ink-soft);min-width:62px}
#voiceMenu{position:absolute;top:40px;left:0;min-width:170px;display:none;flex-direction:column;gap:2px;
  background:#fff;border-radius:14px;padding:8px;box-shadow:0 14px 40px rgba(14,34,71,.18);z-index:60}
#voiceMenu button{border:0;background:transparent;text-align:left;font-size:14.5px;padding:8px 10px;border-radius:9px;color:var(--ink)}
#voiceMenu button:hover{background:var(--accent-soft)}
#voiceMenu button.sel{background:var(--brand);color:#fff;font-weight:700}
#timer{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--ink)}
#glos{cursor:pointer;position:relative;display:inline-block;font-size:14.5px;font-weight:700;color:var(--brand)}
#glos.bump{animation:bump .6s ease}
@keyframes bump{35%{transform:scale(1.14)}}
#glosList{position:absolute;top:34px;right:0;min-width:280px;display:none;background:#fff;border-radius:14px;padding:12px 14px;
  box-shadow:0 14px 40px rgba(14,34,71,.18);z-index:60;font-weight:500;color:var(--ink);font-size:14px;cursor:default}
#glosList .gl-i{padding:4px 0;line-height:1.45}
#glosList b{color:var(--brand)}
/* бейдж непрочитанных слов словаря */
#glosDot{position:absolute;top:-10px;right:-15px;min-width:19px;height:19px;border-radius:10px;background:#F59F1E;color:#fff;
  font-size:12px;font-weight:900;display:none;align-items:center;justify-content:center;padding:0 5px;
  box-shadow:0 3px 8px rgba(197,124,10,.45);animation:dotPop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes dotPop{from{transform:scale(0)}}
#exitBtn{margin-left:auto;border:0;background:rgba(255,255,255,.9);border-radius:16px;padding:11px 18px;font-weight:700;
  font-size:14.5px;color:var(--ink-soft);box-shadow:0 4px 18px rgba(14,34,71,.08)}
#exitBtn:hover{color:var(--bad)}

/* ─────────── чат слева ─────────── */
#chat{position:fixed;left:22px;top:84px;bottom:150px;width:300px;z-index:20;overflow-y:auto;
  display:flex;flex-direction:column;gap:10px;padding-right:6px;scrollbar-width:thin;
  mask-image:linear-gradient(180deg,transparent,#000 26px)}
.b-who{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--ink-faint);margin:2px 0 -4px 6px}
.bubble{max-width:100%;padding:11px 14px;border-radius:15px;font-size:14.5px;line-height:1.5;
  background:var(--paper);box-shadow:0 3px 14px rgba(14,34,71,.07);animation:bubIn .25s ease}
.bubble.child{background:var(--brand);color:#fff;align-self:flex-end}
@keyframes bubIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ─────────── сцена: доска / тренажёр ─────────── */
#stage{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(var(--fit,1));z-index:25;width:min(900px,70vw)}
@media (max-width:1200px){ #stage{width:min(820px,94vw)} #chat{display:none} }
.board{position:relative;border-radius:24px;overflow:hidden;box-shadow:0 26px 70px rgba(10,36,86,.22);
  animation:boardIn .45s cubic-bezier(.2,.8,.25,1);background:var(--paper)}
@keyframes boardIn{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.board.dark{background:linear-gradient(160deg,var(--navy0),var(--navy1));color:#fff}
.bd-pad{padding:38px 46px}
.kicker{font-size:12.5px;font-weight:800;letter-spacing:.22em;color:var(--ink-faint);text-transform:uppercase}
.kicker.danger{color:var(--bad)}
.dark .kicker{color:#8FB0E8}
h1.bd{font-size:44px;font-weight:900;line-height:1.1;margin:10px 0 8px}
h2.bd{font-size:31px;font-weight:900;line-height:1.15;margin:8px 0 4px;color:var(--ink)}
.sub{font-size:16.5px;color:var(--ink-soft);line-height:1.45}
.dark .sub{color:#B9CCF0}
.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.tag{font-size:14px;font-weight:700;padding:8px 15px;border-radius:20px;background:rgba(255,255,255,.1);
  color:#CFE0FF;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:16px}
.cell{background:#F4F8FF;border-radius:16px;padding:17px 18px;box-shadow:inset 0 0 0 1px rgba(27,75,210,.09)}
.cell h4{font-size:16.5px;font-weight:800;margin-bottom:6px;color:var(--ink)}
.cell p{font-size:14.5px;color:var(--ink-soft);line-height:1.45}
.cic{width:46px;height:46px;margin:0 auto 9px;border-radius:14px;background:var(--accent-soft);color:var(--brand);
  display:flex;align-items:center;justify-content:center}
/* картинки на доске «Как платить» */
.pay-cell{text-align:center}
.pay-img{height:210px;margin-bottom:13px;border-radius:14px;background:#fff;overflow:hidden;
  box-shadow:inset 0 0 0 1.5px rgba(27,75,210,.1);display:flex;align-items:center;justify-content:center}
.pay-img img{width:100%;height:100%;object-fit:contain;padding:10px;display:block}
.callout{margin-top:12px;background:var(--accent-soft);border-radius:14px;padding:14px 18px;font-size:15px;
  font-weight:600;color:var(--brand-deep);line-height:1.45}
.arrow{color:var(--brand);font-weight:900}

/* обложка */
.cover .bd-pad{position:relative;text-align:center;padding:30px 40px 26px}
.cover::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(430px 230px at 80% -12%,rgba(46,91,255,.4),transparent 70%),
             radial-gradient(360px 210px at 8% 112%,rgba(46,91,255,.28),transparent 70%)}
.cover{position:relative}
#startBtn{display:block;margin:20px auto 4px;border:0;border-radius:26px;padding:16px 46px;
  font-size:20px;font-weight:800;color:#fff;background:linear-gradient(180deg,#3D6BFF,var(--brand) 55%,var(--brand-deep));
  box-shadow:0 14px 34px rgba(10,36,86,.55),inset 0 1.5px 0 rgba(255,255,255,.35);transition:.15s}
#startBtn:hover{transform:translateY(-2px)}
#startBtn:disabled{opacity:.6;cursor:default;transform:none}
.float-wrap{margin:20px 0 6px}
.float{display:inline-block;transform:rotate(-6deg);animation:float 4.2s ease-in-out infinite}
@keyframes float{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-6deg) translateY(-8px)}}

/* ─────────── стилизованная детская карта (кот) ───────────
   размер задаётся width/height/font-size инлайном, части — в em/% */
.kcard{position:relative;border-radius:18px;background:linear-gradient(150deg,#CFE6FF,#9CC8F8);
  box-shadow:0 18px 40px rgba(10,36,86,.32),inset 0 0 0 1px rgba(255,255,255,.55);color:#0E2247}
.kcard::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.5),rgba(255,255,255,0) 40%),
             radial-gradient(120% 90% at 88% 112%,rgba(27,75,210,.12),transparent 60%)}
.kcard .chip{position:absolute;left:9%;top:34%;width:13%;height:16%;border-radius:.06em;
  background-image:linear-gradient(rgba(120,80,10,.25) 1.5px,transparent 1.5px),
                   linear-gradient(90deg,rgba(120,80,10,.25) 1.5px,transparent 1.5px),
                   linear-gradient(135deg,#F6D77C,#E3B54A);
  background-size:100% 34%,50% 100%,100% 100%;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14),0 1px 2px rgba(10,36,86,.2)}
.kcard .pw{position:absolute;left:26.5%;top:34%;width:.24em;height:.24em}
.kcard .pw i{position:absolute;right:0;top:50%;transform:translateY(-50%);border:1.6px solid transparent;
  border-right-color:rgba(15,58,176,.42);border-radius:50%}
.kcard .pw i:nth-child(1){width:.08em;height:.08em}
.kcard .pw i:nth-child(2){width:.15em;height:.15em}
.kcard .pw i:nth-child(3){width:.22em;height:.22em}
.kcard .bank{position:absolute;right:7%;top:8%;font-weight:900;font-size:.24em;letter-spacing:.06em;color:#0F3AB0}
.kcard .mir{position:absolute;right:7%;bottom:8%;font-weight:900;font-style:italic;font-size:.2em;color:#1D3E77}
.kcard .nm{position:absolute;left:8%;bottom:8%;font-weight:700;font-size:.14em;letter-spacing:.14em;color:#274B86}
.kcard .num{position:absolute;left:8%;bottom:20%;font-weight:800;font-size:.145em;letter-spacing:.1em;color:#1D3E77;
  text-shadow:0 1px 0 rgba(255,255,255,.4)}
.kcard .exp{position:absolute;right:7%;bottom:23%;display:flex;align-items:baseline;gap:.06em;color:#274B86}
.kcard .exp i{font-style:normal;font-weight:800;font-size:.085em;letter-spacing:.08em;color:#4A6CA8}
.kcard .exp b{font-weight:800;font-size:.13em;letter-spacing:.08em}
.kcard .cat{position:absolute;display:block;left:50%;top:47%;transform:translate(-50%,-50%)}
.cat .face{display:block;width:1em;height:.92em;border-radius:50%;background:#fff;position:relative;
  box-shadow:inset 0 -0.06em 0 rgba(29,62,119,.12),0 .05em .18em rgba(15,50,110,.28)}
.cat .ear{position:absolute;top:-.24em;width:0;height:0;border-left:.2em solid transparent;border-right:.2em solid transparent;
  border-bottom:.34em solid #fff}
.cat .ear.l{left:.06em;transform:rotate(-12deg)} .cat .ear.r{right:.06em;transform:rotate(12deg)}
.cat .eye{position:absolute;top:.34em;width:.14em;height:.14em;border-radius:50%;background:#123}
.cat .eye.l{left:.22em} .cat .eye.r{right:.22em}
.cat .nose{position:absolute;top:.52em;left:50%;transform:translateX(-50%);width:.1em;height:.07em;border-radius:50%;background:#F09}
.cat .mouth{position:absolute;top:.56em;left:50%;transform:translateX(-50%);width:.16em;height:.1em;
  border:1.5px solid transparent;border-bottom-color:rgba(29,62,119,.55);border-radius:50%}
.cat .wh{position:absolute;width:.2em;height:1.5px;background:rgba(29,62,119,.38)}
.cat .wl1{left:-.15em;top:.5em;transform:rotate(9deg)} .cat .wl2{left:-.15em;top:.6em;transform:rotate(-5deg)}
.cat .wr1{right:-.15em;top:.5em;transform:rotate(-9deg)} .cat .wr2{right:-.15em;top:.6em;transform:rotate(5deg)}

/* оборотная сторона карты */
.kback{background:linear-gradient(150deg,#9CC8F8,#CFE6FF)}
.kb-stripe{position:absolute;left:0;right:0;top:11%;height:19%;background:linear-gradient(180deg,#16305E,#0E2247)}
.kb-sig{position:absolute;left:7%;top:44%;width:52%;height:15%;border-radius:.04em;
  background:repeating-linear-gradient(45deg,#fff,#fff 4px,#E7F0FB 4px,#E7F0FB 8px);
  box-shadow:inset 0 0 0 1px rgba(27,75,210,.14)}
.kb-cvv{position:absolute;left:63%;top:44%;height:15%;padding:0 .1em;border-radius:.045em;background:#fff;
  display:flex;align-items:center;gap:.35em;font-weight:900;font-size:.15em;letter-spacing:.12em;color:#0E2247;
  box-shadow:inset 0 0 0 1.5px rgba(214,69,69,.45)}
.kb-cvv i{font-style:normal;font-size:62%;font-weight:800;letter-spacing:.08em;color:#8FA2BE}
.kb-help{position:absolute;right:7%;bottom:9%;font-size:.115em;font-weight:700;letter-spacing:.05em;color:#274B86}
.kb-bank{position:absolute;left:7%;bottom:8%;font-weight:900;font-size:.18em;letter-spacing:.06em;color:#0F3AB0}

/* ─────────── доска what: сцена с переворотом и выносками ─────────── */
.scene{display:grid;grid-template-columns:minmax(170px,1fr) auto minmax(170px,1fr);align-items:center;
  margin-top:16px;min-height:300px}
.scene-card{position:relative;z-index:1;text-align:center}
.flip{perspective:1100px;cursor:pointer;display:inline-block;transform:rotate(-5deg);
  animation:cardIn .7s cubic-bezier(.2,.9,.3,1) both .1s}
@keyframes cardIn{from{opacity:0;transform:rotate(-5deg) translateY(16px) scale(.95)}to{opacity:1;transform:rotate(-5deg)}}
.flip-in{position:relative;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.35,.1,.25,1)}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.f{position:relative;transform:translateZ(1px)}
.face.b{position:absolute;inset:0;transform:rotateY(180deg)}
.flip-btn{margin-top:16px;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:20px;
  padding:10px 18px;font-size:14.5px;font-weight:800;color:var(--brand);background:#fff;
  box-shadow:0 6px 18px rgba(14,34,71,.12),inset 0 0 0 1.5px rgba(27,75,210,.22);
  transition:.15s;animation:fadeUp .55s ease both 2.2s}
.flip-btn:hover{background:var(--accent-soft);transform:translateY(-1px)}
.flip-btn .isvg{animation:spinHint 3.5s ease-in-out infinite}
@keyframes spinHint{0%,70%,100%{transform:rotate(0)}80%{transform:rotate(-32deg)}90%{transform:rotate(22deg)}}
.ann-col{display:flex;flex-direction:column;justify-content:flex-start;gap:38px;align-self:stretch;padding-top:105px;
  position:relative;z-index:3}
.ann-col.right{gap:82px;padding-top:25px}
.scene.back .ann-col{gap:21px;padding-top:16px;padding-bottom:0}
.scene.back .ann-col.right{gap:27px;padding-top:74px;padding-bottom:0}
.ann{display:flex;align-items:center;justify-content:flex-end;animation:annIn .55s ease both;animation-delay:var(--d,0s)}
.ann.rev{animation-name:annInR;justify-content:flex-start}
.ann.b{display:none}
.scene.back .ann.f{display:none}
.scene.back .ann.b{display:flex}
.scene.seen .ann{--d:.12s !important}
@keyframes annIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes annInR{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.ann-pill{background:#fff;border-radius:12px;padding:9px 13px;font-size:14px;font-weight:700;color:var(--ink);
  line-height:1.35;box-shadow:0 6px 18px rgba(14,34,71,.12),inset 0 0 0 1px rgba(27,75,210,.1)}
.ann-pill b{color:var(--brand)}
.ann-line{flex:0 1 36px;min-width:22px;height:2px;background:linear-gradient(90deg,rgba(27,75,210,.12),rgba(27,75,210,.5))}
.ann.rev .ann-line{background:linear-gradient(90deg,rgba(27,75,210,.5),rgba(27,75,210,.12))}
.ann-dot{flex:0 0 9px;width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 3px rgba(46,91,255,.2);z-index:2;margin-right:-11px}
.ann.rev .ann-dot{margin-right:0;margin-left:-11px}
.moral{margin:12px auto 0;text-align:center;background:var(--accent-soft);border-radius:16px;padding:13px 20px;
  font-size:17px;font-weight:700;color:var(--brand-deep);line-height:1.45;
  animation:fadeUp .55s ease both;animation-delay:var(--d,0s)}
.moral b{color:var(--brand)}
.moral .isvg{color:var(--brand);margin-right:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.factrow{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:12px;padding:4px 6px;border-radius:16px;
  animation:fadeUp .55s ease both;animation-delay:var(--d,0s)}
.fact{background:#fff;border-radius:20px;padding:8px 15px;font-size:14px;font-weight:700;color:var(--ink-soft);
  box-shadow:inset 0 0 0 1px rgba(27,75,210,.12)}
.fact b{color:var(--ink)}

/* ─────────── код-рисунки: общая моторика ─────────── */
.draw path,.draw circle,.draw rect,.draw line{stroke-dasharray:var(--len,600);stroke-dashoffset:var(--len,600);
  animation:draw .9s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.floaty{animation:floaty 3.4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6px)}}
.dash{stroke-dasharray:6 8;animation:dashrun 1s linear infinite}
@keyframes dashrun{to{stroke-dashoffset:-28}}
.riseup{opacity:1;transform:none;transition:opacity .55s ease var(--d,0s),transform .55s ease var(--d,0s)}
@starting-style{.riseup{opacity:0;transform:translateY(12px)}}

/* ─────────── доска money: монетка летит от родителей на карту ─────────── */
.mscene{position:relative;width:700px;max-width:100%;height:220px;margin:10px auto 0}
.mscene .mphone{position:absolute;left:0;top:44px}
.mscene .trail{position:absolute;inset:0;pointer-events:none}
.mscene .coin{position:absolute;left:0;top:0;width:44px;height:44px;
  offset-path:path('M96 122 Q330 22 600 96');offset-rotate:0deg;animation:coinFly 6.5s ease-in-out infinite}
@keyframes coinFly{
  0%{offset-distance:0%;transform:scale(.45);opacity:0}
  5%{offset-distance:6%;transform:scale(1);opacity:1}
  46%{offset-distance:100%;transform:scale(1);opacity:1}
  52%,100%{offset-distance:100%;transform:scale(.8);opacity:0}
}
.mscene .mcard{position:absolute;right:0;top:48px;animation:recv 6.5s ease-in-out infinite}
@keyframes recv{0%,43%{transform:none}48%{transform:translateY(-7px) scale(1.03)}53%,100%{transform:none}}
.mscene .mbank{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;align-items:center;gap:6px;
  background:#fff;border-radius:14px;padding:7px 13px;font-size:13.5px;font-weight:800;color:var(--ink);
  box-shadow:0 5px 14px rgba(14,34,71,.1),inset 0 0 0 1px rgba(27,75,210,.12)}
.mscene .mbank .isvg{color:var(--brand)}
.mscene .mfast{position:absolute;left:50%;top:33px;transform:translateX(-50%);font-size:12.5px;font-weight:800;color:var(--brand)}
.mscene .mlab{position:absolute;font-size:13.5px;font-weight:800;color:var(--ink-soft)}
.mscene .balance{position:absolute;right:2px;top:164px;font-weight:900;font-size:20px;color:var(--brand-deep)}

/* ─────────── доска cashback: монетка возвращается в копилку ─────────── */
.cbscene{position:relative;width:660px;max-width:100%;height:186px;margin:12px auto 0}
.cbscene .ticket{position:absolute;left:20px;top:44px}
.cbscene .trail{position:absolute;inset:0;pointer-events:none}
.cbscene .jar{position:absolute;right:30px;top:38px;animation:jarBump 6.5s ease-in-out infinite}
@keyframes jarBump{0%,42%{transform:none}48%{transform:translateY(-5px) scale(1.04)}54%,100%{transform:none}}
.cbscene .coin2{position:absolute;left:0;top:0;width:40px;height:40px;
  offset-path:path('M132 86 Q330 2 578 70');offset-rotate:0deg;animation:coinBack 6.5s ease-in-out infinite}
@keyframes coinBack{
  0%{offset-distance:0%;transform:scale(.5);opacity:0}
  5%{offset-distance:6%;transform:scale(1);opacity:1}
  44%{offset-distance:100%;transform:scale(1);opacity:1}
  50%,100%{offset-distance:100%;transform:scale(.75);opacity:0}
}
.cbscene .plus{position:absolute;right:34px;top:6px;font-weight:900;font-size:23px;color:var(--ok);opacity:0;
  animation:plusPop 6.5s ease-in-out infinite}
@keyframes plusPop{0%,43%{opacity:0;transform:translateY(8px) scale(.6)}50%{opacity:1;transform:translateY(-3px) scale(1.15)}60%{opacity:1;transform:none}72%,100%{opacity:0}}
.cbscene .cbpill{position:absolute;left:50%;top:120px;transform:translateX(-50%);font-size:13.5px;font-weight:800;
  color:var(--ok);background:var(--ok-soft);padding:6px 13px;border-radius:14px}
.cbscene .cblab{position:absolute;font-size:13.5px;font-weight:800;color:var(--ink-soft)}

/* ─────────── доска app: телефон-мокап ─────────── */
.phone{width:230px;border-radius:26px;background:#0E2247;padding:9px;box-shadow:0 18px 40px rgba(10,36,86,.3);flex:0 0 auto}
.phone .scr{border-radius:18px;background:#F4F8FF;overflow:hidden;font-size:13px}
.phone .ph-h{background:linear-gradient(135deg,var(--brand),#3D6BFF);color:#fff;padding:11px 12px 9px}
.phone .ph-h .t{font-size:11.5px;font-weight:700;opacity:.85}
.phone .ph-h .b{display:flex;align-items:center;gap:7px;font-size:21px;font-weight:900;letter-spacing:.02em}
.phone ul{list-style:none;padding:7px 10px}
.phone li{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 4px;
  border-bottom:1px solid rgba(27,75,210,.08);font-weight:600}
.phone li:last-child{border-bottom:0}
.phone .lrow{display:flex;align-items:center;gap:7px;color:var(--ink)}
.phone .lrow .isvg{color:var(--brand)}
.phone li .m{color:var(--bad)} .phone li .p{color:var(--ok)}
.phone .ph-btns{display:flex;gap:6px;padding:2px 10px 11px}
.phone .ph-btns span{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;font-size:12px;font-weight:800;
  color:var(--brand);background:var(--accent-soft);border-radius:9px;padding:7px 2px}

/* ─────────── доска safe: правила ─────────── */
.rules{margin-top:16px}
.srule{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;
  background:#F4F8FF;border-radius:20px;padding:24px 18px 18px;box-shadow:inset 0 0 0 1px rgba(27,75,210,.09);overflow:hidden}
.srule::before{content:'';position:absolute;left:0;right:0;top:0;height:4px;background:var(--rc,var(--brand));opacity:.9}
.srule .num{position:absolute;left:13px;top:14px;width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:900;color:#fff;background:var(--rc,var(--brand));box-shadow:0 4px 10px rgba(14,34,71,.18)}
.srule .plate{width:136px;height:136px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 22px rgba(14,34,71,.09),inset 0 0 0 1px rgba(27,75,210,.08)}
.srule .plate svg{display:block}
.srule h4{font-size:17.5px;font-weight:800}
.srule p{font-size:14.5px;color:var(--ink-soft);line-height:1.45;max-width:290px}
/* микро-сценки правил (играют сами, по кругу) */
.sc-pin .bub{transform-box:fill-box;transform-origin:center;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.sc-pin .strike{stroke-dasharray:46;stroke-dashoffset:46;animation:strikeDraw 3.2s ease-in-out infinite}
@keyframes strikeDraw{0%,40%{stroke-dashoffset:46}56%,90%{stroke-dashoffset:0}98%,100%{stroke-dashoffset:46}}
.sc-sms .phone2{transform-box:fill-box;transform-origin:center;animation:buzz 3.2s ease-in-out infinite}
@keyframes buzz{0%,56%,100%{transform:none}61%,69%,77%{transform:translateX(-2.5px) rotate(-2.5deg)}65%,73%{transform:translateX(2.5px) rotate(2.5deg)}}
.sc-sms .stampg{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:stamp 3.2s ease-in-out infinite}
@keyframes stamp{0%,48%{transform:scale(0) rotate(-25deg);opacity:0}58%{transform:scale(1.18) rotate(4deg);opacity:1}64%,90%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1);opacity:0}}
.sc-freeze .frost{clip-path:inset(0 100% 0 0);animation:frost 3.4s ease-in-out infinite}
@keyframes frost{0%{clip-path:inset(0 100% 0 0)}42%,82%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
.sc-freeze .flake{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sc-shield .shield{animation:drop 3.2s cubic-bezier(.34,1.56,.5,1) infinite}
@keyframes drop{0%{transform:translateY(-18px);opacity:0}16%,88%{transform:none;opacity:1}100%{transform:translateY(-12px);opacity:0}}
.sc-shield .ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ringPulse 3.2s ease-out infinite}
@keyframes ringPulse{0%,20%{opacity:0;transform:scale(.55)}30%{opacity:.65;transform:scale(.85)}54%{opacity:0;transform:scale(1.3)}100%{opacity:0}}

/* ─────────── тренажёр ─────────── */
.tprog{font-size:13px;font-weight:800;letter-spacing:.14em;color:var(--ink-faint);text-transform:uppercase}
.tbar{height:5px;background:#E3EBF8;border-radius:3px;margin-top:9px;overflow:hidden}
.tbar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#3D6BFF,var(--brand));transition:width .3s}
#trainer .q{font-size:24px;font-weight:800;line-height:1.3;margin:16px 0 18px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;border:0;text-align:left;border-radius:15px;padding:13px 16px;
  font-size:16.5px;font-weight:600;color:var(--ink);background:#F4F8FF;
  box-shadow:inset 0 0 0 1.5px rgba(27,75,210,.13);transition:.13s}
.opt:not(:disabled):hover{box-shadow:inset 0 0 0 2px var(--brand);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt .ol{flex:0 0 34px;height:34px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:15px;color:var(--brand);box-shadow:inset 0 0 0 1.5px rgba(27,75,210,.16)}
.opt.ok{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok);color:#14602F}
.opt.ok .ol{background:var(--ok);color:#fff;box-shadow:none}
.opt.bad{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad);animation:shake .3s}
.opt.bad .ol{background:var(--bad);color:#fff;box-shadow:none}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.blankrow{display:flex;gap:10px}
.blankrow input{flex:1;border:0;border-radius:15px;padding:15px 18px;font-size:17.5px;font-weight:700;font-family:inherit;
  background:#F4F8FF;box-shadow:inset 0 0 0 1.5px rgba(27,75,210,.2);color:var(--ink);outline:none}
.blankrow input:focus{box-shadow:inset 0 0 0 2px var(--brand)}
.blankrow input.ok{background:var(--ok-soft);box-shadow:inset 0 0 0 2px var(--ok);color:#14602F}
.blankrow input.bad{background:var(--bad-soft);box-shadow:inset 0 0 0 2px var(--bad);animation:shake .3s}
.blankrow button{border:0;border-radius:15px;padding:0 24px;font-size:16px;font-weight:800;color:#fff;background:var(--brand)}
.blankrow button:disabled{opacity:.55;cursor:default}
/* слот обратной связи: место под подсказку/пояснение зарезервировано заранее —
   высота карточки не меняется при ответе, доска не прыгает */
.fbslot{margin-top:14px;min-height:84px}
.hintrow{display:flex;justify-content:flex-start}
#hintBtn{display:inline-flex;align-items:center;gap:7px;border:0;background:#FFF3DA;color:#8A6414;
  font-size:14.5px;font-weight:800;padding:10px 18px;border-radius:20px;transition:.13s;
  box-shadow:inset 0 0 0 1.5px rgba(197,124,10,.35),0 4px 12px rgba(197,124,10,.14)}
#hintBtn:hover{background:#FFE9BD;transform:translateY(-1px)}
#hintBtn .isvg{color:#C08A1E}
#hintPlate{display:none;margin-top:2px;background:#FFF3DA;border-radius:14px;padding:13px 16px;
  font-size:15px;font-weight:600;color:#7A5A17;line-height:1.45}
#hintPlate.on{display:flex;gap:9px;align-items:flex-start;animation:bubIn .25s ease}
#hintPlate .isvg{color:#C08A1E;margin-top:1px}
#explain{display:none;margin-top:2px;background:var(--ok-soft);border-radius:14px;padding:13px 16px;
  font-size:15.5px;font-weight:600;color:#14602F;line-height:1.45}
#explain.on{display:block;animation:bubIn .25s ease}

/* ─────────── reward ─────────── */
.reward-star{display:flex;justify-content:center;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.check{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;padding:7px 0;color:var(--ink)}
.check .c{color:var(--ok);font-weight:900}
.conf{position:fixed;top:-12px;width:9px;height:14px;z-index:80;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(560deg);opacity:.6}}

/* ─────────── маркер-обводка: Аня обводит зону, о которой говорит ─────────── */
.marker-wrap{position:absolute;pointer-events:none;z-index:60;transform:rotate(-1.6deg);transition:opacity .45s ease}
.marker-wrap.out{opacity:0}
.marker-wrap svg{display:block;overflow:visible}
.marker-wrap ellipse{fill:none;stroke:#F59F1E;stroke-linecap:round;
  stroke-dasharray:100 100;stroke-dashoffset:100;animation:mkDraw .85s cubic-bezier(.45,0,.25,1) forwards}
.marker-wrap ellipse.mk2{stroke-width:2.6;opacity:.5;animation-delay:.18s}
@keyframes mkDraw{to{stroke-dashoffset:0}}

/* ─────────── мик + подсказка + подпись ─────────── */
#micWrap{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);z-index:40;text-align:center}
/* подсказка-пилюля сидит ПОД доской (ближе к контексту), а не у мика; top ставит positionHint() */
#hint{position:fixed;left:50%;top:60%;transform:translateX(-50%);z-index:26;display:none;width:fit-content;margin:0;max-width:min(580px,70vw);padding:11px 22px;border-radius:22px;
  align-items:center;gap:9px;font-size:16px;font-weight:800;color:var(--brand-deep);background:#fff;
  box-shadow:0 10px 28px rgba(14,34,71,.14),inset 0 0 0 1.5px rgba(27,75,210,.14)}
#hint.act{color:#fff;background:linear-gradient(180deg,#3D6BFF,var(--brand));
  box-shadow:0 12px 30px rgba(27,75,210,.4);animation:hintPulse 1.8s ease-in-out infinite}
@keyframes hintPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.035)}}
/* ── микрофон ребёнка: большая синяя кнопка снизу по центру ── */
#micB{width:76px;height:76px;border-radius:50%;border:0;color:#fff;display:inline-flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 32% 28%,#4C79FF,var(--brand) 70%);
  box-shadow:0 16px 36px rgba(27,75,210,.45),inset 0 2px 0 rgba(255,255,255,.3);transition:.18s}
#micB:hover{transform:scale(1.05)}
#micB.muted{background:#93A3BE;box-shadow:0 10px 24px rgba(14,34,71,.25)}
#micB.live{animation:micPulse 1.6s ease-in-out infinite}
@keyframes micPulse{50%{box-shadow:0 16px 36px rgba(27,75,210,.45),0 0 0 14px rgba(43,160,90,.16)}}
#caption{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:40;text-align:center;
  font-size:14.5px;font-weight:600;color:var(--ink-soft);max-width:600px;min-height:20px}

/* ── Аня: плейсхолдер аватара (без фото), женский силуэт — снизу слева.
   Место под будущий риг/портрет дизайнера; состояния idle/listening/speaking/thinking. */
#anyaDock{position:fixed;left:22px;bottom:52px;z-index:40;display:flex;align-items:center;gap:12px}
@media (max-width:640px){ #anyaDock .a-info{display:none} }
.anya{position:relative;width:76px;height:76px;flex:0 0 auto;--amp:0}
.a-ph{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 32% 24%,#F3F8FF,#CFDFF9 58%,#B3CDF6);
  box-shadow:0 12px 26px rgba(27,75,210,.28),inset 0 0 0 1.5px rgba(255,255,255,.7);
  font-size:34px;font-weight:900;color:var(--brand);user-select:none;transition:transform .2s}
.anya[data-st="speaking"] .a-ph{animation:aTalk 1.35s ease-in-out infinite}
@keyframes aTalk{50%{transform:scale(1.05)}}
.a-ring{position:absolute;inset:-7px;border-radius:50%;pointer-events:none;opacity:0;transition:.25s}
.anya[data-st="listening"] .a-ring{opacity:1;animation:listenPulse 1.7s ease-in-out infinite}
@keyframes listenPulse{0%,100%{box-shadow:0 0 0 3px rgba(43,160,90,.6)}50%{box-shadow:0 0 0 11px rgba(43,160,90,.14)}}
.anya[data-st="speaking"] .a-ring{opacity:1;
  box-shadow:0 0 calc(12px + var(--amp)*28px) calc(3px + var(--amp)*7px) rgba(46,91,255,.4),0 0 0 3px rgba(46,91,255,.32)}
.a-think{position:absolute;top:-12px;right:-8px;display:flex;gap:4px;align-items:flex-end;opacity:0;transition:.2s}
.anya[data-st="thinking"] .a-think{opacity:1}
.a-think i{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.a-think i:nth-child(2){width:9px;height:9px}
.a-think i:nth-child(3){width:11px;height:11px}
.anya[data-st="thinking"] .a-think i{animation:thinkDot 1.2s ease-in-out infinite}
.anya[data-st="thinking"] .a-think i:nth-child(2){animation-delay:.15s}
.anya[data-st="thinking"] .a-think i:nth-child(3){animation-delay:.3s}
@keyframes thinkDot{50%{transform:translateY(-4px);opacity:.6}}
.a-info{display:flex;flex-direction:column;gap:1px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);
  border-radius:14px;padding:8px 15px;box-shadow:0 4px 18px rgba(14,34,71,.1),inset 0 0 0 1px rgba(27,75,210,.07)}
.a-info .an{font-weight:800;font-size:15px;color:var(--ink)}
.a-info .as{font-weight:600;font-size:13px;color:var(--ink-soft)}
</style>
</head>

/* ────────────────────────── состояние UI ────────────────────────── */
let curBoard='', currentTask=null, startVis=true, startTxt='Начать урок', startDisabled=false;
let muted=false, timerId=null, timerT0=0, teacher='Аня';
const openedTerms=new Set();

function renderBoard(name, animate){
  const f=BOARDS[name]; if(!f) return;
  curBoard=name; currentTask=null; lastAsk='';
  stage.innerHTML=f();
  if(animate===false){ const b=stage.querySelector('.board'); if(b) b.style.animation='none'; }
  wireStart(); wireScene();
  revealTerms(name);
  if(name==='money'){ const bal=$('bal'); if(bal) setTimeout(()=>countUp(bal,1250,1400),950); }
  if(name==='reward') confetti();
  updateHint();
}
function wireStart(){
  const b=$('startBtn'); if(!b) return;
  b.textContent=startTxt; b.disabled=startDisabled; b.style.display=startVis?'':'none';
  b.onclick=(ev)=>{ ev.stopPropagation(); if(E.onStart) E.onStart(); };
}
/* переворот карты на доске what */
function wireScene(){
  const flip=$('cardFlip'); if(!flip) return;
  const t=()=>setCardSide(!flip.classList.contains('flipped'));
  flip.onclick=t;
  const b=$('flipBtn'); if(b) b.onclick=t;
}
function setCardSide(back){
  const flip=$('cardFlip'); if(!flip) return;
  flip.classList.toggle('flipped',back);
  const scene=stage.querySelector('.scene'); if(scene){ scene.classList.toggle('back',back); scene.classList.add('seen'); }
  const b=$('flipBtn'); if(b) b.querySelector('span').textContent = back ? 'Показать лицевую сторону' : 'Перевернуть карту';
}
let unseenTerms=0;
function updateGlosDot(){ const d=$('glosDot'); if(!d) return;
  if(unseenTerms>0){ d.style.display='flex'; d.textContent=unseenTerms>9?'9+':unseenTerms; } else d.style.display='none'; }
function revealTerms(board){
  let addedN=0;
  TERMS.forEach(t=>{ if(t.board===board && !openedTerms.has(t.w)){ openedTerms.add(t.w); addedN++; } });
  $('glosCount').textContent=openedTerms.size+'/'+TERMS.length;
  if(addedN){ renderGlos(); const g=$('glos'); g.classList.remove('bump'); void g.offsetWidth; g.classList.add('bump');
    if($('glosList').style.display!=='block'){ unseenTerms+=addedN; updateGlosDot(); } }
}
function renderGlos(){
  const opened=TERMS.filter(t=>openedTerms.has(t.w));
  $('glosList').innerHTML=opened.length
    ? opened.map(t=>'<div class="gl-i"><b>'+esc(t.w)+'</b> — '+esc(t.d)+'</div>').join('')
    : 'пока пусто — термины открываются по ходу урока';
}
$('glos').onclick=()=>{ const l=$('glosList'); renderGlos();
  const open=l.style.display!=='block';
  l.style.display=open?'block':'none';
  if(open){ unseenTerms=0; updateGlosDot(); } };

/* ────────────────────────── тренажёр ────────────────────────── */
const LETTERS=['А','Б','В','Г','Д'];
function normalize(s){ return String(s||'').toLowerCase().trim().replace(/ё/g,'е').replace(/\s+/g,' ').replace(/[.!?\s]+$/,''); }
function renderTask(step, animate){
  currentTask=step; curBoard=''; lastAsk='';
  const n=TASKS.indexOf(step)+1, total=TASKS.length;
  const pct=Math.round(n/total*100);
  let inner='<div class="tprog">Задание '+(n>0?n:'?')+' из '+total+'</div>'
    +'<div class="tbar"><i style="width:'+(n>0?pct:0)+'%"></i></div>'
    +'<div class="q">'+esc(step.q||'')+'</div>';
  if(step.variant==='choice' && Array.isArray(step.options)){
    inner+='<div class="opts">'+step.options.map((o,i)=>
      '<button class="opt" data-i="'+i+'"><span class="ol">'+(LETTERS[i]||'·')+'</span><span>'+esc(o.t)+'</span></button>').join('')+'</div>';
  } else {
    inner+='<div class="blankrow"><input id="blankIn" autocomplete="off" placeholder="впиши ответ…"/><button id="blankGo">Проверить</button></div>';
  }
  inner+='<div class="fbslot">'
    +(step.hint? '<div class="hintrow"><button id="hintBtn">'+ic('help',16)+'<span>Подсказка</span></button></div><div id="hintPlate"></div>' : '')
    +'<div id="explain"></div></div>';
  stage.innerHTML='<div class="board" id="trainer" data-screen-label="Тренажёр: задание '+n+'"><div class="bd-pad">'+inner+'</div></div>';
  if(animate===false){ const b=stage.querySelector('.board'); if(b) b.style.animation='none'; }
  updateHint();

  const hb=$('hintBtn');
  if(hb){ hb.onclick=()=>{ const p=$('hintPlate');
    p.innerHTML=ic('help',16)+'<span>'+esc(step.hint)+'</span>'; p.classList.add('on'); hb.parentElement.style.display='none'; }; }

  if(step.variant==='choice'){
    stage.querySelectorAll('.opt').forEach(btn=>{
      btn.onclick=()=>{
        if(!currentTask) return;
        const o=step.options[+btn.dataset.i];
        if(o && o.correct){ solveUI(btn, step); }
        /* неверный вариант остаётся красным до конца задания (фидбек 08-07:
           вспышка на 450мс гасла, и ребёнок мог «перебирать» без следа ошибки);
           disabled — чтобы нельзя было тыкать тот же вариант повторно */
        else { btn.classList.add('bad'); btn.disabled=true; if(E.onWrong) E.onWrong(); }
      };
    });
  } else {
    const go=()=>{
      if(!currentTask) return;
      const v=normalize($('blankIn').value);
      const ok=[step.answer,...(step.accept||[])].some(a=>normalize(a)===v);
      if(ok){ solveUI($('blankIn'), step); $('blankIn').disabled=true; $('blankGo').disabled=true; }
      /* красная рамка держится, пока ребёнок не начнёт править ответ; при повторной
         неверной проверке — перезапуск тряски через reflow */
      else { const bi=$('blankIn'); bi.classList.remove('bad'); void bi.offsetWidth; bi.classList.add('bad'); if(E.onWrong) E.onWrong(); }
    };
    $('blankGo').onclick=go;
    $('blankIn').onkeydown=(e)=>{ if(e.key==='Enter') go(); };
    $('blankIn').oninput=()=>$('blankIn').classList.remove('bad');
    setTimeout(()=>{ try{$('blankIn').focus()}catch(_){}} ,150);
  }
}
function solveUI(el, step){
  if(el && el.classList){ el.classList.remove('bad'); el.classList.add('ok'); }
  const ex=$('explain'); if(ex && step.explain){ ex.textContent=step.explain; ex.classList.add('on'); }
  const hb=$('hintBtn'); if(hb) hb.parentElement.style.display='none';
  const hp=$('hintPlate'); if(hp) hp.classList.remove('on');
  const solvedStep=step; currentTask=null;
  updateHint();
  if(E.onSolve) E.onSolve(solvedStep);
}
/* счётчик баланса на доске money */
function countUp(el,to,ms){ const t0=performance.now(); (function step(t){ const k=Math.min(1,(t-t0)/ms);
  el.textContent=Math.round(to*(1-Math.pow(1-k,3))).toLocaleString('ru'); if(k<1 && el.isConnected) requestAnimationFrame(step); })(performance.now()); }
function confetti(){
  const colors=['#1B4BD2','#7FB2FF','#F6D77C','#2BA05A','#fff'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div'); c.className='conf';
    c.style.left=(Math.random()*100)+'vw';
    c.style.background=colors[i%colors.length];
    c.style.animationDuration=(2.6+Math.random()*2.2)+'s';
    c.style.animationDelay=(Math.random()*0.9)+'s';
    document.body.appendChild(c); setTimeout(()=>c.remove(),6000);
  }
}

/* ────────────────── подсветка зон по словам Ани ──────────────────
   Транскрипт реплики приходит до озвучки → зона подсвечивается, когда Аня

   оборота карты (stripe/cvv/support) — при них карта сама переворачивается. */
const HL_RULES = {
  what:     [ {re:/имя|фамили|именн/i, hl:'name'}, {re:/чип/i, hl:'chip'}, {re:/«?мир»?|платёжн/i, hl:'mir'},
              {re:/счёт|счет|ключ|не в карте/i, hl:'account'}, {re:/родител|6 лет|шести лет|бесплатн/i, hl:'parents'},
              {re:/магнитн|полоса(?!.*подпис)/i, hl:'stripe'}, {re:/подпис/i, hl:'sig'},
              {re:/cvv|cvc|секретные цифры|три цифры/i, hl:'cvv'},
              {re:/втб|банк выпустил|какой банк/i, hl:'bank'},
              {re:/номер карт/i, hl:'cardnum'}, {re:/срок|действ/i, hl:'expiry'},
              {re:/помощ|поддержк|телефон банка|горяч/i, hl:'support'} ],
  money:    [ {re:/пополн|мгновен|карманн|со своего телефона/i, hl:'topup'}, {re:/лимит|потолок/i, hl:'limit'},
              {re:/вид(ит|ят)|забота|команда|присмотр/i, hl:'watch'}, {re:/счёт|схем/i, hl:'flow'} ],
  pay:      [ {re:/терминал|приложи|кассе|пик/i, hl:'tap'}, {re:/пин|pin|секретн.*код|прикрыва/i, hl:'pin'},
              {re:/стикер|qr|кью-?ар|телефон|камер/i, hl:'phone-pay'}, {re:/из рук|не отдав/i, hl:'handsoff'} ],
  app:      [ {re:/баланс|истори|перевод|комисси|чат|оплат/i, hl:'features'}, {re:/скрыть|заморо|разморо/i, hl:'tricks'},
              {re:/приложени|детский банк|в телефоне/i, hl:'phone'} ],
  safe:     [ {re:/пин|pin/i, hl:'r-pin'}, {re:/смс|код(ы|ов)? из|мошенник|звон/i, hl:'r-sms'},
              {re:/потерял|заморо/i, hl:'r-freeze'}, {re:/родител|заблокир|вместе/i, hl:'r-parents'} ],
  cashback: [ {re:/кино|300|45|билет/i, hl:'example'}, {re:/возвраща|процент|10|15/i, hl:'how'},
              {re:/родител|14|копит/i, hl:'where'} ],
};
const HL_BACK=new Set(['stripe','sig','cvv','support']);
const HL_FRONT_CARD=new Set(['name','chip','mir','bank','cardnum','expiry']);
/* маркер-обводка: Аня обводит зону, как цветным маркером в тетради */
function markerCircle(el){
  const board=stage.querySelector('.board'); if(!board || !el.isConnected) return;
  const bR=board.getBoundingClientRect(), eR=el.getBoundingClientRect();
  if(eR.width<2 || eR.height<2) return;
  const s=(bR.width/board.offsetWidth)||1, pad=10;
  const x=(eR.left-bR.left)/s-pad, y=(eR.top-bR.top)/s-pad;
  const w=eR.width/s+pad*2, h=eR.height/s+pad*2;
  const rx=Math.max(6,w/2-3), ry=Math.max(6,h/2-3);
  const wrap=document.createElement('div');
  wrap.className='marker-wrap';
  wrap.style.cssText='left:'+x.toFixed(1)+'px;top:'+y.toFixed(1)+'px;width:'+w.toFixed(1)+'px;height:'+h.toFixed(1)+'px';
  wrap.innerHTML='<svg width="100%" height="100%" viewBox="0 0 '+w.toFixed(1)+' '+h.toFixed(1)+'">'
    +'<ellipse cx="'+(w/2).toFixed(1)+'" cy="'+(h/2).toFixed(1)+'" rx="'+rx.toFixed(1)+'" ry="'+ry.toFixed(1)+'" pathLength="100" stroke-width="4.2"></ellipse>'
    +'<ellipse class="mk2" cx="'+(w/2+2).toFixed(1)+'" cy="'+(h/2-1.5).toFixed(1)+'" rx="'+Math.max(4,rx-3).toFixed(1)+'" ry="'+Math.max(4,ry-3).toFixed(1)+'" pathLength="100"></ellipse>'
    +'</svg>';
  board.appendChild(wrap);
  setTimeout(()=>wrap.classList.add('out'),3300);
  setTimeout(()=>wrap.remove(),3900);
}
function markZone(hl){ stage.querySelectorAll('[data-hl="'+hl+'"]').forEach(el=>markerCircle(el)); }
function highlightFromText(text){
  const rules=HL_RULES[curBoard]; if(!rules) return;
  const hits=[]; rules.forEach(r=>{ if(r.re.test(text) && !hits.includes(r.hl)) hits.push(r.hl); });
  hits.slice(0,3).forEach((hl,i)=>setTimeout(()=>{
    let flipDelay=0;
    if(curBoard==='what'){
      const flip=$('cardFlip'), flipped=flip && flip.classList.contains('flipped');
      if(HL_BACK.has(hl) && !flipped){ setCardSide(true); flipDelay=780; }
      else if(HL_FRONT_CARD.has(hl) && flipped){ setCardSide(false); flipDelay=780; }
    }
    setTimeout(()=>markZone(hl), flipDelay);
  }, i*1600));
}

/* ────────────────────────── чат / подпись / статус ────────────────────────── */
let lastAsk='';  // последний ВОПРОС Ани — подписываем у мика, когда очередь ребёнка
function pushBubble(who,text){
  if(!text) return;
  if(who==='tutor'){
    highlightFromText(text);
    // вытащить последний вопрос (…?) из её реплики — чтобы ребёнок видел, на что отвечать
    const qs=text.match(/[^.!?]*\?/g);
    if(qs&&qs.length){ lastAsk=qs[qs.length-1].replace(/^[\s"'«»—–-]+/,'').trim(); }
  }
  const lbl=document.createElement('div'); lbl.className='b-who';
  lbl.textContent=(who==='tutor'? teacher.toUpperCase() : (childName||'ТЫ').toUpperCase());
  const b=document.createElement('div'); b.className='bubble'+(who==='child'?' child':''); b.textContent=text;
  chat.appendChild(lbl); chat.appendChild(b);
  while(chat.children.length>80){ chat.removeChild(chat.firstChild); }
  chat.scrollTop=chat.scrollHeight;
}
let voiceStatus='idle';
function setStatus(s){
  const map={listening:['#2BA05A','слушает'],speaking:['#2E5BFF','говорит'],thinking:['#E8A23A','думает']};
  const v=map[s]||['#93A3BE','ждёт'];
  $('statusDot').style.background=v[0]; $('statusTxt').textContent=v[1];
  const as=$('anyaState'); if(as) as.textContent=v[1];
  micB.classList.toggle('live', s==='listening' && !muted);
  $('avaOrb').classList.toggle('talk', s==='speaking');
  const o=$('anyaOrb'); if(o) o.dataset.st=(s==='listening'||s==='speaking'||s==='thinking')? s : 'idle';
  voiceStatus=s; updateHint();
}
/* «что сейчас сделать»: задание в тренажёре главнее голосового статуса */
function updateHint(){
  const h=$('hint'); if(!h) return;
  let txt='', icn='', act=false;
  if(currentTask){
    if(currentTask.variant==='blank'){ txt='Впиши ответ и нажми «Проверить»'; icn='edit'; }
    else { txt='Выбери ответ на экране'; icn='pointer'; }
    act=true;
  }
  else if(voiceStatus==='speaking'){ txt='Аня говорит — дослушай и отвечай'; icn='volume'; }
  else if(voiceStatus==='thinking'){ txt='Аня думает…'; icn='dots'; }
  else if(voiceStatus==='listening'){ txt=lastAsk||'Твоя очередь — говори'; icn='mic'; act=true; }
  h.innerHTML=txt? ic(icn,16)+'<span>'+txt+'</span>' : '';
  h.classList.toggle('act',act);
  h.style.display=txt?'flex':'none';
  fitStage();
}
/* масштабирование доски под высоту окна: доска живёт между топбаром и микрофоном */
function fitStage(){
  const b=stage.firstElementChild;
  if(!b){ stage.style.removeProperty('--fit'); positionHint(); return; }
  const micTop=$('micB').getBoundingClientRect().top;
  const lo=74, hi=micTop-92; /* резерв ПОД доской: там теперь сидит пилюля-подсказка */
  const avail=Math.max(240, hi-lo);
  const s=Math.min(1, avail/b.offsetHeight);
  stage.style.setProperty('--fit', s.toFixed(4));
  stage.style.top=Math.round((lo+hi)/2)+'px';
  positionHint();
}
/* пилюля-подсказка следует за нижней кромкой доски — «прилипает» к тому, что на экране */
function positionHint(){
  const h=$('hint'); if(!h) return;
  const b=stage.firstElementChild;
  const top=b ? stage.getBoundingClientRect().bottom+14 : Math.round(window.innerHeight*0.60);
  h.style.top=Math.round(top)+'px';
}
window.addEventListener('resize', fitStage);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>fitStage());

/* ────────────────── таймер / голоса / мик / выход ────────────────── */
function startTimer(){
  if(timerId) return; timerT0=Date.now();
  timerId=setInterval(()=>{
    const s=Math.floor((Date.now()-timerT0)/1000);
    $('timerTxt').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
  },1000);
}
function setVoiceMenu(voices, selectedKey){
  const m=$('voiceMenu');
  m.innerHTML=(voices||[]).map(v=>'<button data-k="'+esc(v.key)+'" class="'+(v.key===selectedKey?'sel':'')+'">'+esc(v.label)+'</button>').join('');
  m.querySelectorAll('button').forEach(b=>{ b.onclick=(ev)=>{ ev.stopPropagation(); m.style.display='none'; if(E.onVoiceSelect) E.onVoiceSelect(b.dataset.k); }; });
}
$('avatarChip').onclick=()=>{ const m=$('voiceMenu'); m.style.display=m.style.display==='flex'?'none':'flex'; };
document.addEventListener('click',(e)=>{ if(!e.target.closest('#avatarChip')) $('voiceMenu').style.display='none';
  if(!e.target.closest('#glos')) $('glosList').style.display='none'; });
micB.onclick=()=>{ muted=!muted; micB.classList.toggle('muted',muted); setMicIcon(muted);
  if(muted) micB.classList.remove('live'); if(E.onMute) E.onMute(muted); };
$('exitBtn').onclick=()=>{ if(confirm('Выйти из урока?')) window.top.location.href='/cabinet'; };

/* ────────────────────────── ЕНГИН-МОСТ (контракт) ────────────────────────── */
const E = {
  onStart:null, onMute:null, onSolve:null, onWrong:null, onVoiceSelect:null, onPlanetClick:null,
  setStatus:setStatus,
  setCaption:(t)=>{ caption.textContent=t||''; },
  setMuted:(m)=>{ muted=!!m; micB.classList.toggle('muted',muted); setMicIcon(muted); if(muted) micB.classList.remove('live'); },
  setChildName:(n)=>{ childName=String(n||''); if(curBoard==='what'||curBoard==='cover') renderBoard(curBoard,false); },
  setTeacherName:(n)=>{ teacher=String(n||'Аня'); const L=(teacher[0]||'А').toUpperCase(); $('avaOrb').textContent=L; const al=$('anyaLetter'); if(al) al.textContent=L; },
  showStartButton:()=>{ startVis=true; wireStart(); },
  hideStartButton:()=>{ startVis=false; wireStart(); },
  setStartButtonText:(t,dis)=>{ startTxt=t||startTxt; startDisabled=!!dis; wireStart(); },
  startTimer:startTimer,
  setVoiceMenu:setVoiceMenu,
  /* доп. (не ломает контракт): громкость TTS 0..1 — орб Ани пульсирует по голосу */
  setVoiceLevel:(v)=>{ const o=$('anyaOrb'); if(o) o.style.setProperty('--amp', String(Math.max(0,Math.min(1,+v||0)))); },
  /* доп.: обвести зону маркером вручную (то же, что делает речь Ани через pushBubble) */
  highlightZone:(hl)=>markZone(hl),
  showBoard:(name,animate)=>{ renderBoard(name,animate); },
  showTask:(step,animate)=>{ const t=(typeof step==='object'&&step)?step:TASKS.find(x=>x.id===step); if(t) renderTask(t,animate); },
  hideTool:(animate)=>{ curBoard=''; currentTask=null; stage.innerHTML=''; updateHint(); },
  pushBubble:pushBubble,
};
window.__klassioEngine = E;

/* стартовое состояние: обложка + подпись */
renderBoard('cover');
caption.textContent='Нажми «Начать урок» — Аня поздоровается голосом';

/* ── листание слайдов стрелками ←/→ (для ручного теста) ──
   Плейлист = каждая доска, а следом её задания, в порядке урока. */
const PREVIEW_SEQ=[];
BOARD_ORDER.forEach(b=>{ PREVIEW_SEQ.push({t:'b',n:b}); TASKS.filter(x=>x.board===b).forEach(x=>PREVIEW_SEQ.push({t:'q',s:x})); });
let previewIdx=0;
function previewGo(dir){
  previewIdx=Math.max(0,Math.min(PREVIEW_SEQ.length-1,previewIdx+dir));
  const it=PREVIEW_SEQ[previewIdx];
  if(it.t==='b') renderBoard(it.n); else renderTask(it.s);
  caption.textContent='Тест · '+(previewIdx+1)+' / '+PREVIEW_SEQ.length+' · листай стрелками ← →';
}
document.addEventListener('keydown',(e)=>{
  if(e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.key==='ArrowRight'||e.key==='PageDown'){ e.preventDefault(); previewGo(1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); previewGo(-1); }
});

/* отладка руками: __kd.show('what') / __kd.task(9) / __kd.reward() */
window.__kd={ show:(b)=>E.showBoard(b), task:(n)=>E.showTask(TASKS[n-1]), reward:()=>E.showBoard('reward'), st:(s)=>E.setStatus(s) };
</script>
