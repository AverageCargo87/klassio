# /etc/nginx/sites-available/voice-proxy
# Klassio voice WS-proxy: TLS termination + WS-upgrade passthrough to Node on 3001.
#
# Deployed onto h2.nexus VPS (87.120.93.35, Debian 11, Frankfurt).
# Source of truth in repo: infra/h2nexus/nginx/voice-proxy.conf

# Plain HTTP → redirect to HTTPS (and ACME challenge passthrough handled by certbot's --nginx mode).
server {
    listen 80;
    listen [::]:80;
    server_name 87.120.93.35.nip.io;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS + WSS — main path
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 87.120.93.35.nip.io;

    ssl_certificate     /etc/letsencrypt/live/87.120.93.35.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/87.120.93.35.nip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Disable buffering for streaming WS frames.
    proxy_buffering off;

    # Long-lived sessions — 45-min lesson + headroom.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # Health check (plain HTTP at /healthz inside Node — useful for monitoring).
    location = /healthz {
        proxy_pass http://127.0.0.1:3001/healthz;
        proxy_http_version 1.1;
        access_log off;
    }

    # ── Sber-tutor orchestrator (RU stack, /tutor-ru route) → Node on 3002 ──
    # Same box, same TLS cert; the orchestrator does its own HMAC check on
    # upgrade (sid/t/s query params). Source: infra/h2nexus/sber-tutor/.
    location = /sber-tutor/healthz {
        proxy_pass http://127.0.0.1:3002/healthz;
        proxy_http_version 1.1;
        access_log off;
    }

    location /sber-tutor {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else — WS upgrade to local Node.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
